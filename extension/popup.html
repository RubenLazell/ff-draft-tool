<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FF Draft Tool</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #111827;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
      }
      input,
      select {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background: #111827;
        color: white;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #111827;
        border: 1px solid #d1d5db;
        margin-top: 8px;
      }
      .error {
        color: #dc2626;
        font-size: 12px;
        min-height: 16px;
        margin: 6px 0 0;
      }
      .status {
        color: #16a34a;
        font-size: 12px;
        min-height: 16px;
        margin: 6px 0 0;
      }
      #loggedInAs {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 10px;
      }
      .site-link {
        display: block;
        font-size: 12px;
        color: #2563eb;
        text-decoration: none;
        margin: -4px 0 12px;
      }
      .site-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>FF Draft Tool</h1>
    <a
      class="site-link"
      href="https://ff-draft-tool-neon.vercel.app/"
      target="_blank"
      rel="noopener noreferrer"
      >Open ff-draft-tool-neon.vercel.app ↗</a
    >

    <div id="loginView">
      <label>Email<input type="email" id="email" autocomplete="username" /></label>
      <label>Password<input type="password" id="password" autocomplete="current-password" /></label>
      <button id="loginBtn">Log in</button>
      <p id="loginError" class="error"></p>
    </div>

    <div id="settingsView" hidden>
      <p id="loggedInAs"></p>
      <label>Format<select id="format"></select></label>
      <label>Top overall<input type="number" id="topOverall" min="1" max="50" /></label>
      <label>Top per position<input type="number" id="topPerPosition" min="1" max="20" /></label>
      <button id="saveSettingsBtn">Save</button>
      <button id="showPanelBtn" class="secondary">Show panel on this page</button>
      <button id="logoutBtn" class="secondary">Log out</button>
      <p id="saveStatus" class="status"></p>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
